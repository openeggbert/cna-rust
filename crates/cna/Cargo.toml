[package]
name = "cna-rust"
description = "Safe CNA and Microsoft.Xna.Framework-compatible Rust frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
cna-sys = { package = "cna-rust-sys", path = "../cna-sys", version = "0.0.0" }

[features]
default = ["dynamic-loading"]
# How the audited function tables are filled. Exactly one is expected.
#
# `dynamic-loading` resolves every route through the platform loader at run
# time, which is the historical behaviour and stays the default: it adds no
# link-time dependency on CNA, so a consumer can build without the library
# present and point at one later.
#
# `direct-link` fills the same tables from typed `extern "C"` declarations
# instead. CNA must then resolve at link time, which is what a target with no
# dynamic loader -- WebAssembly being the reason this exists -- requires. The
# safe API is identical either way.
dynamic-loading = []
direct-link = ["cna-sys/direct-link"]
# Test-only bridge fault points. They remain inert unless the deliberately
# named CNA_RUST_TEST_FAULT environment variable is also set.
native-fault-injection = []

[lib]
name = "cna"
path = "src/lib.rs"

[lints]
workspace = true
